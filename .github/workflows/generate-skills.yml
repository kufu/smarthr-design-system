name: generate-skills

# マージ後に SKILL.md を自動再生成し、差分があればそのまま push する。
# - SKILL.md は自動生成物として扱い、PR 上の diff は気にしない方針。
# - LLM は CI 上で回さない（M2-S5 の教訓）。LLM 実行は更新者ローカル限定、CI は再生成だけ。
# - フォーク PR からの push トリガーは構造上発生しないが、念のため repo 一致を確認する。
#
# 【push 先について】
# main にマージされた変更を起点に再生成し、生成物 (plugins/.../skills) の差分を
# 専用 GitHub App (skill-bot) のトークンで main へ直接コミット&push する。
# main は保護ブランチ (Ruleset) だが、bypass_actors に当 App を bypass_mode: always で
# 登録済みのため直接 push が許可される。push 主体を App トークンにすることで bypass が効く
# （GITHUB_TOKEN は push に使わない）。
#
# 【ジョブ分割について】
# App トークンは保護された main へ push できる強い権限なので、依存パッケージのコード
# （install スクリプト・生成スクリプトの依存・husky の pre-commit フックなど）が
# 動くジョブからは触れられないようにする。
# - generate ジョブ: トークンなし（persist-credentials: false）で依存を入れて再生成し、
#   差分を patch として artifact にアップロードするだけ。
# - push ジョブ: Node/pnpm のセットアップも依存のインストールもせず、App トークンを
#   発行して patch を当て、フックを無効にしてコミット&push する。
# 差分は `git diff --binary` の patch で受け渡す。ディレクトリをそのまま artifact にすると
# ファイルの削除が伝わらず、patterns/ のシンボリックリンクも実体化されてしまうため。
# workflow_dispatch を main 以外のブランチで実行すると generate ジョブだけが動く（dry-run）。

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src/content/articles/products/components/**/index.mdx'
      - 'src/content/articles/products/components/**/checklist.yaml'
      - 'src/content/articles/products/components/**/_components/**/*.mdx'
      # パターンのシンボリックリンクを足したら、design-review の URL 対応表を作り直す
      - 'plugins/smarthr-design-system/skills/design-pattern-guidelines/patterns/**'
      - 'scripts/generate-skills/**'
      - '.github/data/eslint-rule-names.txt'
      - '.github/workflows/generate-skills.yml'
  workflow_dispatch:

# 同一ブランチでの再生成は直列化し、race を防ぐ。
concurrency:
  group: generate-skills-${{ github.ref }}
  cancel-in-progress: false

# push は App トークンで行うため GITHUB_TOKEN には書き込み権限を与えない。
permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true' # npx（netlify-cli など）向け。pnpm 12 は NPM_CONFIG_* を読まない
  PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
  NPM_CONFIG_BEFORE: ''
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440' # minutes (1 day)

jobs:
  generate:
    # フォーク PR からのトリガーは構造上発生しないが、念のため二重防御。
    if: github.repository == 'kufu/smarthr-design-system'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Set NPM_CONFIG_BEFORE
        run: |
          echo "NPM_CONFIG_BEFORE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # 依存パッケージのコードが動くジョブなので、認証情報を .git/config に残さない。
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate SKILL.md
        # eslint ルール README はコミット済みスナップショット (eslint-rules-snapshot.json) を
        # 使うため、CI 上ではネットワーク・GITHUB_TOKEN なしで生成できる。
        # 上流ルールを更新する場合はローカルでスナップショットを再生成してコミットする。
        run: pnpm --filter ./scripts/generate-skills generate

      - name: Create patch if SKILL.md changed
        id: diff
        # 未追跡ファイル・削除・シンボリックリンクも含めるため、index に載せてから
        # --binary で patch を作る（index はこのジョブ内だけのもので、コミットはしない）。
        run: |
          mkdir -p "$RUNNER_TEMP/skills-patch"
          git add -A plugins/smarthr-design-system/skills
          if git diff --cached --quiet -- plugins/smarthr-design-system/skills; then
            echo "No SKILL.md changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary -- plugins/smarthr-design-system/skills > "$RUNNER_TEMP/skills-patch/skills.patch"
          git diff --cached --stat -- plugins/smarthr-design-system/skills
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: skills-patch
          path: ${{ runner.temp }}/skills-patch/skills.patch
          if-no-files-found: error
          retention-days: 1

  push:
    needs: generate
    # main 以外（workflow_dispatch でのブランチ実行）では push しない。
    if: needs.generate.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # このジョブでは Node/pnpm のセットアップや依存のインストールをしない。
    # App トークンを持つ間はリポジトリ内のコード（フック・スクリプト）を実行しない。
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.SKILL_BOT_APP_ID }}
          private-key: ${{ secrets.SKILL_BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # generate ジョブと同じコミットを checkout し、patch がそのまま当たるようにする。
          # App トークンで checkout し、後続の push も App として実行する（Ruleset の bypass 対象）。
          token: ${{ steps.app-token.outputs.token }}

      - name: Download patch
        uses: actions/download-artifact@v8.0.2
        with:
          name: skills-patch
          path: ${{ runner.temp }}/skills-patch

      - name: Apply patch
        # patch は依存パッケージのコードが動いた generate ジョブで作られるため、中身を信用しない。
        # git apply --index は patch 内の全パスを index に載せ、後続の commit はそれをすべて含めるので、
        # skills 以外のパスが 1 つでも変わっていたら push せずに失敗させる。
        # また、生成スクリプトは通常ファイル（mode 100644）しか書かないので、シンボリックリンク・
        # 実行権限・サブモジュールなど、それ以外のモードが関わる変更（追加・置換・削除）も止める。
        # パス検証だけでは、skills 配下に置いた外部を指すシンボリックリンクを防げないため。
        run: |
          git apply --index "$RUNNER_TEMP/skills-patch/skills.patch"
          if git diff --cached --name-only --no-renames -z | grep -zv '^plugins/smarthr-design-system/skills/' | tr '\0' '\n' | grep .; then
            echo "::error::patch が plugins/smarthr-design-system/skills 以外のパスを変更しています。push を中止します。"
            exit 1
          fi
          if ! git diff --cached --raw --no-renames --no-abbrev -z | tr '\0' '\n' \
            | awk -F'[ \t]' '/^:/ { if (($1 != ":100644" && $1 != ":000000") || ($2 != "100644" && $2 != "000000")) { print; bad = 1 } } END { exit bad }'; then
            echo "::error::patch が通常ファイル以外（シンボリックリンク・ファイルモードなど）を変更しています。push を中止します。"
            exit 1
          fi

      - name: Get app user id
        id: app-user
        # コミットの author/committer を App bot に正しく帰属させるため user id を取得する。
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Commit & push
        # 依存パッケージ由来の husky / lint-staged フックを動かさないよう、フックは無効にする。
        # 生成中に main が進んでいても push できるよう、push 前に rebase する。
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add plugins/smarthr-design-system/skills
          git -c core.hooksPath=/dev/null commit -m "chore: SKILL.md 自動再生成 [skip ci]"
          git -c core.hooksPath=/dev/null pull --rebase origin "$GITHUB_REF_NAME"
          git -c core.hooksPath=/dev/null push origin "HEAD:$GITHUB_REF"
