items:
  # 基本的な考え方
  - severity: must
    text: 'ユーザーの利用目的に沿って、オブジェクトの関係性や重要度を表すようにページレイアウトを設計する'
    source_section: '基本的な考え方'

  # 基本的な考え方 > リード文を適切に設定する
  - severity: must
    text: 'SmartHRで提供するページでは、リード文を見出し領域に表示する'
    source_section: '基本的な考え方 > リード文を適切に設定する'
    sub_items:
      - 'ユーザーが作成したオブジェクトの詳細画面ではリード文は不要'

  # 基本的な考え方 > ページ内の要素同士を適切にグルーピングする
  - severity: must
    text: '視覚的グルーピングを参照して、ページ内の要素を適切にグルーピングする'
    source_section: '基本的な考え方 > ページ内の要素同士を適切にグルーピングする'

  # 基本的な考え方 > ページが過度に長くなることを避ける
  - severity: should
    text: 'ページが縦方向に長くなってしまう場合は、次のような対処を検討する'
    source_section: '基本的な考え方 > ページが過度に長くなることを避ける'
    sub_items:
      - 'コンテンツを省略表示する'
      - 'ページをナビゲーションで分割する'

  # 基本的な考え方 > ページが過度に長くなることを避ける > コンテンツを省略表示する
  - severity: must
    text: 'コンテンツを省略表示する場合は、Disclosure を使ってユーザーが必要に応じてコンテンツをすべて表示できるようにする'
    source_section: '基本的な考え方 > ページが過度に長くなることを避ける > コンテンツを省略表示する'

  # 基本的な考え方 > ページが過度に長くなることを避ける > ページをナビゲーションで分割する
  - severity: must
    text: 'ページを分割する場合は、TabBar・SideNav・SideMenu といったナビゲーションを使う'
    source_section: '基本的な考え方 > ページが過度に長くなることを避ける > ページをナビゲーションで分割する'

  # 基本的な考え方 > モバイル > 複数カラムのレイアウトを避ける
  - severity: avoid
    text: 'モバイルでは複数カラムのレイアウトを避け、垂直方向に積み上げるか複数の画面に分けるなどして、1度に表示する情報量を減らす'
    source_section: '基本的な考え方 > モバイル > 複数カラムのレイアウトを避ける'

  - severity: should
    text: '垂直方向に積み上げて解決できない場合は、アダプティブなレイアウトを検討する'
    source_section: '基本的な考え方 > モバイル > 複数カラムのレイアウトを避ける'

  # 基本的な考え方 > モバイル > 水平方向のスクロールや2次元（垂直・水平方向）スクロールを避ける
  - severity: avoid
    text: '水平方向のスクロールや2次元（垂直・水平方向）スクロールを避け、画面幅からあふれるコンテンツは折り返す'
    source_section: '基本的な考え方 > モバイル > 水平方向のスクロールや2次元（垂直・水平方向）スクロールを避ける'
    sub_items:
      - '画像や動画・地図など、2次元であることが情報を伝える上で重要な場合はその限りではない'

  # 構成
  - severity: must
    text: 'エラー画面を除き、ページをヘッダー（AppHeader）とコンテナ領域（Container）で構成する'
    source_section: '構成'
    sub_items:
      - 'コンテナ領域は、ナビゲーション（任意）・見出し領域・コンテンツ領域で構成する'

  # 構成 > ヘッダー
  - severity: must
    text: 'AppHeader を画面の最上部に配置する'
    source_section: '構成 > ヘッダー'

  # 構成 > コンテナ領域
  - severity: must
    text: 'コンテナ領域には Container を使う'
    source_section: '構成 > コンテナ領域'
    sub_items:
      - 'コンテナ領域の横幅は size props で指定する（サイズの選び方は Container を参照）'

  # 構成 > コンテナ領域 > ナビゲーション
  - severity: must
    text: 'ページ内で複数のビューを切り替えるナビゲーションには、TabBar・SideNav・SideMenu を使う'
    source_section: '構成 > コンテナ領域 > ナビゲーション'

  # 構成 > コンテナ領域 > 見出し領域
  - severity: must
    text: '見出し領域には、画面タイトル（PageHeading）とリード文、それに関連する情報や操作を表示する'
    source_section: '構成 > コンテナ領域 > 見出し領域'

  # 構成 > コンテナ領域 > コンテンツ領域
  - severity: should
    text: 'コンテンツ領域には主にセクションを表示する'
    source_section: '構成 > コンテナ領域 > コンテンツ領域'

  # レイアウト > 余白の取り方
  - severity: must
    text: '余白は「余白の取り方」に従って取る'
    source_section: 'レイアウト > 余白の取り方'

  # 種類 > コレクション（テーブル）
  - severity: should
    text: 'オブジェクトを一覧表示するページで、オブジェクト同士を属性情報で比較するユースケースがある場合に使う'
    source_section: '種類 > コレクション（テーブル）'

  - severity: must
    text: '見出し領域とよくあるテーブルで構成する'
    source_section: '種類 > コレクション（テーブル）'

  # 種類 > コレクション（テーブル） > モバイル
  - severity: avoid
    text: 'モバイルでは使わず、代わりにコレクション（リスト）を検討する'
    source_section: '種類 > コレクション（テーブル） > モバイル'

  # 種類 > コレクション（リスト）
  - severity: should
    text: 'オブジェクトを一覧表示するページで、狭い領域（主にモバイル）でオブジェクトを一覧表示する場合に使う'
    source_section: '種類 > コレクション（リスト）'

  - severity: must
    text: '見出し領域とよくあるリストで構成する'
    source_section: '種類 > コレクション（リスト）'

  # 種類 > シングル（1カラム）
  - severity: must
    text: 'オブジェクトを詳細表示するページで、オブジェクトの情報がすべて並列な関係にある場合に使う'
    source_section: '種類 > シングル（1カラム）'

  - severity: must
    text: '見出し領域と複数のセクションで構成する'
    source_section: '種類 > シングル（1カラム）'

  # 種類 > シングル（1カラム） > モバイル > セクションが1つの場合のレイアウト
  - severity: should
    text: 'セクションが1つで横幅を広く使いたい場合は、Panel を使わずにコンテンツ領域の背景色が WHITE になるよう領域を区切ることを検討してよい'
    source_section: '種類 > シングル（1カラム） > モバイル > セクションが1つの場合のレイアウト'

  # 種類 > シングル（2カラム）
  - severity: should
    text: 'オブジェクトを詳細表示するページで、主情報と副情報の情報量・重要度に大きく差がある場合に使う'
    source_section: '種類 > シングル（2カラム）'
    sub_items:
      - 'ID・更新日時・登録者を確認しながら、書類を閲覧・操作したい場合'
      - '従業員の基本的な情報（名前や部署など）を閲覧しながら、蓄積された過去の情報（経歴やスキル情報など）を閲覧したい場合'
    note: '大きく差がある の定義不在。要人間判断'

  - severity: must
    text: '見出し領域と副情報のセクション、主情報のセクションで構成する'
    source_section: '種類 > シングル（2カラム）'

  - severity: must
    text: '主情報を表示する領域の横幅は、副情報を表示する領域の横幅の2倍以上にする'
    source_section: '種類 > シングル（2カラム）'

  # 種類 > シングル（2カラム） > モバイル
  - severity: avoid
    text: 'モバイルでは使わず、代わりにシングル（1カラム）として表示する'
    source_section: '種類 > シングル（2カラム） > モバイル'
    sub_items:
      - '副情報と主情報のうち、ユーザーが先に確認する必要のある情報から順番にセクションを表示する'

  # 種類 > シングル（Panelのある見出し領域）
  - severity: should
    text: 'オブジェクトを詳細表示するページで、見出し領域とコンテンツ領域の幅が異なる場合に使う'
    source_section: '種類 > シングル（Panelのある見出し領域）'
    sub_items:
      - '二次元スクロールを伴う独自のビュー（ツリー図・マトリクス表・グラフ）を表示する場合'

  - severity: must
    text: '見出し領域とコンテンツ領域で構成する'
    source_section: '種類 > シングル（Panelのある見出し領域）'

  # 種類 > シングル（Panelのある見出し領域） > モバイル
  - severity: should
    text: 'コンテンツが二次元スクロールを伴う場合は、モバイルでも同様のレイアウトが適しているか、モバイルに適した他のレイアウトはないか検討する'
    source_section: '種類 > シングル（Panelのある見出し領域） > モバイル'
    sub_items:
      - 'リストのような垂直方向のスクロールで操作できるレイアウトを使うと、モバイルでの操作性を高められる'

  # 種類 > サイドナビゲーションとコンテンツの2カラム
  - severity: should
    text: '設定画面など、AppNavi のドロップダウンではサイドナビゲーション項目を十分に表示できない場合に使う'
    source_section: '種類 > サイドナビゲーションとコンテンツの2カラム'
    sub_items:
      - 'ナビゲーションが AppNavi のドロップダウンでは収まらない場合'
      - 'ナビゲーション同士を頻繁に行き来する場合'
      - 'ナビゲーションが階層構造になっている場合'

  - severity: must
    text: 'サイドナビゲーション領域とコンテンツ領域で構成し、サイドナビゲーションには SideMenu を使う'
    source_section: '種類 > サイドナビゲーションとコンテンツの2カラム'
    sub_items:
      - 'コンテンツ領域はコレクションかシングルのレイアウトをとる'

  # 種類 > サイドナビゲーションとコンテンツの2カラム > モバイル
  - severity: avoid
    text: 'モバイルでは使わず、サイドナビゲーションの操作を AppNavi に含めることを検討する'
    source_section: '種類 > サイドナビゲーションとコンテンツの2カラム > モバイル'
    sub_items:
      - 'ページレイアウトはコレクション（リスト）、シングル（1カラム）のいずれかの形を取る'

  # 種類 > コレクションとシングルの2カラム
  - severity: should
    text: '一覧と詳細が別画面であると不都合がある場合に使う'
    source_section: '種類 > コレクションとシングルの2カラム'
    sub_items:
      - 'オブジェクトを頻繁に切り替える場合'

  - severity: must
    text: 'オブジェクトの見出し領域とコレクション領域、シングル領域で構成し、コレクション領域には SideNav を使う'
    source_section: '種類 > コレクションとシングルの2カラム'
    sub_items:
      - 'シングル領域はシングルのレイアウトを取る'

  # 種類 > コレクションとシングルの2カラム > モバイル
  - severity: avoid
    text: 'モバイルでは使わず、次のいずれかの方法で対処する'
    source_section: '種類 > コレクションとシングルの2カラム > モバイル'
    sub_items:
      - 'コレクション（リスト）とシングル（1カラム）の2つのページに分割する'
      - 'SideNav を使ったコレクションをドロワーで表示する（smarthr-ui で対応を検討中）'

  # 種類 > コレクションとシングルの2カラム > モバイル > [WIP] SideNavをドロワーで表示する
  - severity: must
    text: 'SideNav をドロワーで表示する場合は、ドロワーを開くボタンをセクション内に表示する'
    source_section: '種類 > コレクションとシングルの2カラム > モバイル > [WIP] SideNavをドロワーで表示する'
    note: 'smarthr-ui未実装（モバイル対応時に有効化）'
