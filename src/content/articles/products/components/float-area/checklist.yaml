items:
  # レイアウト > 基本的な考え方
  - severity: must
    text: 'FloatArea は画面内のどの部分が対象の領域なのかを視覚的に示すことを目指して、位置・幅・レイヤー順序を調整する'
    source_section: 'レイアウト > 基本的な考え方'

  # レイアウト > レイアウト例 > スクロール固定中
  - severity: must
    text: 'スクロール固定中の FloatArea は、対象の領域の左右に 0.5（8px）ずつはみ出し、画面の下辺から 1.5（24px）の余白をとった位置に置く'
    source_section: 'レイアウト > レイアウト例 > スクロール固定中'

  # レイアウト > レイアウト例 > スクロール固定解除後
  - severity: must
    text: 'スクロール固定解除後の FloatArea は、対象の領域の下辺との間に 1.5（24px）の余白を取る'
    source_section: 'レイアウト > レイアウト例 > スクロール固定解除後'

  # アクセシビリティ > 開発時の考慮点 > フォーカスの順序と見た目の順序を一致させる
  - severity: must
    text: 'FloatArea内に配置されたButtonなどのコンポーネントが、見た目の順序の通りメインコンテンツの最後にフォーカスされるようDOMの順序と視覚的な順序を一致させる'
    source_section: 'アクセシビリティ > 開発時の考慮点 > フォーカスの順序と見た目の順序を一致させる'

  # モバイル
  - severity: should
    text: 'モバイルで FloatArea を画面の下部に固定する必要がある場合は、独自に実装せず fixedOnMobile を指定する'
    source_section: 'モバイル'

  # モバイル > レイアウト > 画面の下部に固定する場合
  - severity: must
    text: 'fixedOnMobile で画面の下部に固定している間、tertiaryButton には variant="tertiary" の Button を使う'
    source_section: 'モバイル > レイアウト > 画面の下部に固定する場合'
