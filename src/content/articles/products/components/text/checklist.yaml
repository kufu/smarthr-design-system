items:
  # 使用上の注意 > 入れ子にしたときの出力要素に注意する
  - severity: must
    text: 'Text を入れ子にする場合は Valid な HTML になるよう出力要素に注意する'
    source_section: '使用上の注意 > 入れ子にしたときの出力要素に注意する'

  # 使用上の注意 > 省略表示したテキストは隠れたままになることに注意する > 省略表示を推奨するケース
  - severity: should
    text: 'ユーザーの操作過程で「確認が必須ではない」程度の情報を表示する場合は maxLines での省略表示を検討してよい'
    source_section: '使用上の注意 > 省略表示したテキストは隠れたままになることに注意する > 省略表示を推奨するケース'

  - severity: should
    text: 'テーブルのセル内やリスト形式の UI で視認性を確保する場合は maxLines での省略表示を検討してよい'
    source_section: '使用上の注意 > 省略表示したテキストは隠れたままになることに注意する > 省略表示を推奨するケース'

  # 使用上の注意 > 省略表示したテキストは隠れたままになることに注意する > 省略表示を避けるケース
  - severity: avoid
    text: '単に情報を省略する目的では maxLines での省略表示を使用しない'
    source_section: '使用上の注意 > 省略表示したテキストは隠れたままになることに注意する > 省略表示を避けるケース'

  - severity: avoid
    text: 'ユーザーが把握しておかないと操作が進められないような重要な情報は maxLines で省略せず、常に表示することを検討する'
    source_section: '使用上の注意 > 省略表示したテキストは隠れたままになることに注意する > 省略表示を避けるケース'
    sub_items:
      - 'パスワードに使用できる文字や、エラーになる入力値などの入力要件'
      - '入力エラーとなった際のエラーメッセージ'
      - '操作補助になる情報（ショートカットなど）'
      - 'ボタンなどの操作 UI のラベル'

  # モバイル
  - severity: must
    text: 'タッチデバイスでは hover 表示を前提とした Tooltip は使用せず、Disclosure を使用する'
    source_section: 'モバイル'

  # 種類 > 見出しスタイル
  - severity: must
    text: '見出しとして使う場合は Text ではなく Heading を使う'
    source_section: '種類 > 見出しスタイル'
