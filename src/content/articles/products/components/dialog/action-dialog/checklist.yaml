items:
  # 使用上の注意 > ダイアログを乱用しない
  - severity: should
    text: 'ダイアログとして表示する・操作させるべき内容なのか慎重にユースケースを定義し、使用を検討する'
    source_section: '使用上の注意 > ダイアログを乱用しない'

  # 使用上の注意 > 複数のモーダルダイアログを同時に表示しない (via MultipleModalWarning.mdx)
  - severity: avoid
    text: 'モーダルダイアログを 1 つの操作で複数個表示したり、モーダルダイアログ上の操作によって 2 つ目のモーダルダイアログを表示したりしない'
    source_section: '使用上の注意 > 複数のモーダルダイアログを同時に表示しない (via MultipleModalWarning.mdx)'

  # 使用上の注意 > ダイアログコンテンツにフォームが含まれている場合は、FormDialogの使用を検討する
  - severity: should
    text: 'ダイアログコンテンツにフォーム要素を含む場合は FormDialog の使用を検討する'
    source_section: '使用上の注意 > ダイアログコンテンツにフォームが含まれている場合は、FormDialogの使用を検討する'

  # モバイル > レイアウト > フッターエリアのレイアウト
  - severity: must
    text: 'モバイルで［キャンセル］ボタンと Primary ボタンを Cluster で横いっぱいに並べる'
    source_section: 'モバイル > レイアウト > フッターエリアのレイアウト'
    sub_items:
      - '`SubActionArea`（任意）は Button 群の下部に配置する'
